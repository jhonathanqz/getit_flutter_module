name: getit_flutter_module
description: >-
  Dependency injection for Flutter with its own service locator (MGetIt)
  and modules that register on route entry and auto-dispose on exit.
version: 0.1.0
repository: https://github.com/jhonathanqz/getit_flutter_module
issue_tracker: https://github.com/jhonathanqz/getit_flutter_module/issues

topics:
  - dependency-injection
  - service-locator
  - modular
  - routing

screenshots:
  - description: 'getit_flutter_module logo'
    path: assets/logo.png

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
